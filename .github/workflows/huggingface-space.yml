# Mirror main to a Hugging Face Space after every merge. Does nothing until the repository has a
# variable HF_SPACE (e.g. "your-username/caplife-ai") and a secret HF_TOKEN (a Hugging Face write
# token). Setup: docs/huggingface-space.md. The Streamlit Community Cloud app is unaffected.
name: Mirror to Hugging Face Space

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: huggingface-space
  cancel-in-progress: true

jobs:
  mirror:
    if: ${{ vars.HF_SPACE != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install the Hugging Face client
        run: python -m pip install "huggingface_hub>=0.24"
      - name: Upload to the Space
        env:
          HF_SPACE: ${{ vars.HF_SPACE }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python deploy/huggingface/sync.py
