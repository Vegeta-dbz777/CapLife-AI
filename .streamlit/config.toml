[theme]
# Inter for text and Plus Jakarta Sans for headings, served by the app itself (static/fonts, SIL Open Font
# License), so pages load no fonts from other sites.
font = "Inter"
headingFont = "Plus Jakarta Sans"
headingFontWeights = [800, 750, 700, 700, 650, 650]
baseRadius = "0.75rem"
showWidgetBorder = true
showSidebarBorder = true

[theme.light]
primaryColor = "#08796B"
backgroundColor = "#F7FAF9"
secondaryBackgroundColor = "#E9F2F0"
textColor = "#142A2A"
borderColor = "#B8CDCA"
dataframeHeaderBackgroundColor = "#DFECE9"
chartCategoricalColors = ["#08796B", "#A24D16", "#345BB2", "#A03762", "#567529"]

[theme.light.sidebar]
backgroundColor = "#EAF3F1"
secondaryBackgroundColor = "#F7FAF9"

[theme.dark]
primaryColor = "#4FDDC5"
backgroundColor = "#0B1214"
secondaryBackgroundColor = "#142125"
textColor = "#EEF5F4"
borderColor = "#2D4145"
dataframeHeaderBackgroundColor = "#1A2B2F"
chartCategoricalColors = ["#4FDDC5", "#F6B77B", "#8CA9FF", "#F689A4", "#ACD078"]

[theme.dark.sidebar]
backgroundColor = "#101B1E"
secondaryBackgroundColor = "#19292D"

[[theme.fontFaces]]
family = "Inter"
url = "app/static/fonts/inter-latin-wght-normal.woff2"
weight = "100 900"

[[theme.fontFaces]]
family = "Plus Jakarta Sans"
url = "app/static/fonts/plus-jakarta-sans-latin-wght-normal.woff2"
weight = "200 800"

[server]
maxUploadSize = 8
enableStaticServing = true
