<script>
(() => {
    // Streamlit Community Cloud gives visitors "Fork" and a GitHub button in the app's toolbar, and gives
    // the app's owner Share, star, edit and the same GitHub button. Hide Fork and GitHub for visitors only:
    // the owner, who never gets Fork, keeps every button.
    if (window.__caplifeRepoButtons) return;
    window.__caplifeRepoButtons = true;
    const label = (item) => (item.querySelector('[data-testid="stToolbarActionButtonLabel"]')?.textContent || "").trim();
    // The GitHub button is icon-only: its name is only in aria-label="source" (no visible text).
    const isGitHub = (item) => [...item.querySelectorAll("button, a")].some((el) =>
        /\bsource\b|github/.test(`${el.getAttribute("aria-label") || ""} ${el.getAttribute("title") || ""} ${el.getAttribute("href") || ""}`.toLowerCase()));
    const update = () => {
        const items = [...document.querySelectorAll('[data-testid="stToolbarActionButton"]')];
        const visitor = items.some((item) => label(item) === "Fork");
        for (const item of items) {
            const hide = visitor && (label(item) === "Fork" || isGitHub(item));
            if ((item.style.display === "none") !== hide) item.style.display = hide ? "none" : "";
        }
    };
    new MutationObserver(update).observe(document.body, { childList: true, subtree: true });
    update();
})();
</script>
